name: Vignette

options:
  bundleIdPrefix: dev.maxhafs
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    DEAD_CODE_STRIPPING: YES

targets:
  Vignette:
    type: application
    platform: macOS
    sources:
      - path: Sources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.maxhafs.vignette
        PRODUCT_NAME: Vignette
        # Display name only. PRODUCT_NAME stays "Vignette" in both configs so the
        # bundle path and `pkill -x Vignette` work the same either way.
        APP_DISPLAY_NAME: Vignette
        INFOPLIST_FILE: Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: Resources/Vignette.entitlements
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "Apple Development"
        DEVELOPMENT_TEAM: AH9NNPN928
        PROVISIONING_PROFILE_SPECIFIER: ""
        ENABLE_HARDENED_RUNTIME: YES
        # Xcode ships Debug builds as a stub exe + Vignette.debug.dylib (for
        # Preview hot-reload). That split breaks TCC: the Accessibility grant
        # never sticks. We need one plain executable.
        ENABLE_DEBUG_DYLIB: NO
        SWIFT_STRICT_CONCURRENCY: complete
        COMBINE_HIDPI_IMAGES: YES
      configs:
        # Debug gets its own bundle id so a locally-built copy and an installed
        # release can hold Accessibility permission at the same time. They share a
        # signature-keyed TCC entry otherwise, and each grant revokes the other.
        Debug:
          PRODUCT_BUNDLE_IDENTIFIER: dev.maxhafs.vignette.debug
          APP_DISPLAY_NAME: Vignette (Debug)
        Release:
          CODE_SIGN_ENTITLEMENTS: Resources/Vignette-Release.entitlements
          # Xcode injects get-task-allow into every signed build unless told not
          # to, which would put a debugger hole in the shipped app.
          CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO
    scheme:
      testTargets:
        - VignetteTests

  VignetteTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests
    settings:
      base:
        SWIFT_VERSION: "6.0"
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: Vignette
