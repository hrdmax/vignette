name: Release

# Tag-triggered rather than merge-triggered: a release is a deliberate act, and
# every merge cutting one would spam the tap with versions nobody installs.
#
#   git tag v0.2.0 && git push origin v0.2.0
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release, without the leading v (e.g. 0.2.0)'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Work out the version
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            VERSION="$INPUT_VERSION"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          # This value also enters Xcode settings and a generated Ruby cask.
          # Accept only a numeric release version, before writing GITHUB_ENV.
          if [[ ! "$VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::Version must have the form MAJOR.MINOR.PATCH (e.g. 0.2.0)"
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "TAG=v$VERSION" >> "$GITHUB_ENV"

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Import signing certificate
        env:
          CERT_P12: ${{ secrets.SIGNING_CERT_P12 }}
          CERT_PASSWORD: ${{ secrets.SIGNING_CERT_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/build.keychain"
          echo "$CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" \
            -P "$CERT_PASSWORD" -T /usr/bin/codesign
          # Without this, codesign blocks on a GUI password prompt that can never
          # be answered on a runner.
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          security list-keychain -d user -s "$KEYCHAIN" login.keychain

          rm "$RUNNER_TEMP/cert.p12"

          # A self-signed certificate must be explicitly trusted for code signing
          # or codesign refuses to use it. Pulled back out of the keychain rather
          # than the .p12, so this doesn't depend on the runner's openssl flavour.
          security find-certificate -c "Vignette Self-Signed" -p "$KEYCHAIN" \
            > "$RUNNER_TEMP/cert.pem"
          sudo security add-trusted-cert -d -r trustRoot -p codeSign \
            -k /Library/Keychains/System.keychain "$RUNNER_TEMP/cert.pem"

          security find-identity -v -p codesigning "$KEYCHAIN"

      - name: Build
        run: |
          set -o pipefail
          xcodegen generate
          xcodebuild -project Vignette.xcodeproj -scheme Vignette \
            -configuration Release -derivedDataPath build \
            MARKETING_VERSION="$VERSION" \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Vignette Self-Signed" \
            DEVELOPMENT_TEAM="" \
            OTHER_CODE_SIGN_FLAGS="--timestamp=none" \
            build

      - name: Verify the signature
        run: |
          APP="build/Build/Products/Release/Vignette.app"
          codesign --verify --deep --strict --verbose=2 "$APP"
          codesign -dvvv "$APP" 2>&1 | grep -E "Identifier|Authority|CDHash"
          # get-task-allow in a shipped build would be a hole; fail loudly if the
          # Release entitlements ever regress.
          if codesign -d --entitlements - "$APP" 2>/dev/null | grep -q "get-task-allow"; then
            echo "::error::Release build carries get-task-allow"
            exit 1
          fi

      - name: Package
        run: |
          APP="build/Build/Products/Release/Vignette.app"
          ZIP="Vignette-$VERSION.zip"
          # ditto, not zip: preserves the bundle's symlinks and resource forks.
          ditto -c -k --keepParent "$APP" "$ZIP"
          echo "ZIP=$ZIP" >> "$GITHUB_ENV"
          echo "SHA256=$(shasum -a 256 "$ZIP" | cut -d' ' -f1)" >> "$GITHUB_ENV"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$TAG" "$ZIP" \
            --title "Vignette $VERSION" \
            --generate-notes \
            --notes-file - <<NOTES
          Install:

              brew install --cask ${{ github.repository_owner }}/tap/vignette

          Vignette is signed but not notarized (that needs a paid Apple
          membership), so the first launch is blocked. Approve it once under
          System Settings > Privacy & Security > Open Anyway.
          NOTES

      - name: Update the Homebrew tap
        env:
          DEPLOY_KEY: ${{ secrets.TAP_DEPLOY_KEY }}
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.repository }}
        run: |
          # Deploy key rather than a PAT: write access to this one repo, nothing else.
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/tap_deploy
          chmod 600 ~/.ssh/tap_deploy
          ssh-keyscan github.com >> ~/.ssh/known_hosts 2>/dev/null
          export GIT_SSH_COMMAND="ssh -i ~/.ssh/tap_deploy -o IdentitiesOnly=yes"

          git clone "git@github.com:$OWNER/homebrew-tap.git" tap
          mkdir -p tap/Casks

          cat > tap/Casks/vignette.rb <<CASK
          cask "vignette" do
            version "$VERSION"
            sha256 "$SHA256"

            url "https://github.com/$REPO/releases/download/v#{version}/Vignette-#{version}.zip"
            name "Vignette"
            desc "Blurs every window except the focused one"
            homepage "https://github.com/$REPO"

            # Symbol form, not a string comparison: the string form is deprecated
            # and warns on every brew command. The symbol already means "or newer".
            depends_on macos: :sonoma

            app "Vignette.app"

            zap trash: [
              "~/Library/Preferences/dev.maxhafs.vignette.plist",
              "~/Library/Saved Application State/dev.maxhafs.vignette.savedState",
            ]
          end
          CASK

          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/vignette.rb

          if git diff --staged --quiet; then
            echo "Cask already up to date; nothing to push."
            exit 0
          fi
          git commit -m "vignette $VERSION"

          # GitHub sometimes rejects a push with "cannot lock ref ... is at <our
          # own new commit>" — it applied the push, then failed to acknowledge it.
          # Failing the release there would be a lie, since the cask has shipped.
          # So: treat "remote already has our commit" as success, and rebase and
          # retry anything else rather than dying on a transient race.
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              exit 0
            fi

            git fetch origin main
            if [ "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)" ]; then
              echo "Push landed despite the error; remote is at $(git rev-parse --short HEAD)."
              exit 0
            fi

            echo "Push attempt $attempt failed; rebasing and retrying."
            git rebase origin/main
            sleep 3
          done

          echo "::error::Could not push the updated cask after 3 attempts"
          exit 1
